spring.application.name=SistemaInteligenteTI

# Carga opcional de variables locales desde SistemaInteligenteTI/.env (soporte nativo de Spring Boot)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL_TI}
spring.datasource.username=${DB_USERNAME_TI}
spring.datasource.password=${DB_PASSWORD_TI}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
 
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=DEBUG

# Servicio de IA (FastAPI): el backend es siempre el cliente (T-29)
ai.base-url=${AI_SERVICE_URL:http://localhost:8001}
ai.service-token=${AI_SERVICE_TOKEN:}
ai.classification-timeout=10s
ai.analysis-timeout=30s
ai.embedding-timeout=30s
