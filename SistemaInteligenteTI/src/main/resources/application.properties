spring.application.name=SistemaInteligenteTI

# Carga opcional de variables locales desde SistemaInteligenteTI/.env (soporte nativo de Spring Boot)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL_TI}
spring.datasource.username=${DB_USERNAME_TI}
spring.datasource.password=${DB_PASSWORD_TI}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
 
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=DEBUG
