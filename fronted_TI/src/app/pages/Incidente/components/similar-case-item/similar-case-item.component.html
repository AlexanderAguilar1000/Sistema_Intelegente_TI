<div class="reference-card" [class.open]="open()">
  <button type="button" class="reference-item" [attr.aria-expanded]="open()" (click)="toggle.emit()">
    <svg class="lead-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect width="8" height="4" x="8" y="2" rx="1" ry="1" />
      <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
      <path d="M12 11h4M12 16h4M8 11h.01M8 16h.01" />
    </svg>
    <span class="info">
      <span class="title">{{ case().title }}</span>
      <span class="code">{{ case().code }}</span>
    </span>
    <span class="similarity">{{ case().similarity }}%</span>
    <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="m6 9 6 6 6-6" />
    </svg>
  </button>

  @if (open()) {
    <div class="reference-detail">
      <div class="badges">
        <app-status-badge [status]="case().status" />
        <span class="chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z" />
            <circle cx="7.5" cy="7.5" r=".5" fill="currentColor" />
          </svg>
          {{ case().type }}
        </span>
        <app-priority-badge [priority]="case().priority" />
        <span class="chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="22" x2="2" y1="12" y2="12" />
            <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z" />
            <line x1="6" x2="6.01" y1="16" y2="16" />
            <line x1="10" x2="10.01" y1="16" y2="16" />
          </svg>
          {{ case().area }}
        </span>
      </div>
      <div>
        <p class="field-label">Descripción</p>
        <p class="text">{{ case().description }}</p>
      </div>
      <div>
        <p class="field-label">Solución aplicada</p>
        <p class="text strong">{{ case().solution }}</p>
      </div>
      <p class="foot">Resuelto por {{ case().resolvedBy }} · {{ case().resolvedAt }}</p>
    </div>
  }
</div>
